<!DOCTYPE html><html><head>    <meta charset="UTF-8" />    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />    <meta name="viewport" content="width=device-width, initial-scale=1.0,maximum-scale=1.0, user-scalable=no" />    <meta name="apple-mobile-web-app-title" content="京东路由" />    <meta http-equiv="pragma" content="no-cache">    <meta http-equiv="cache-control" content="no-cache">    <meta http-equiv="expires" content="0">    <title></title>    <link rel="stylesheet" href="./bootstrap/css/bootstrap.min.css">    <link href="P_IMG/icon.png" rel="icon" type="image/x-icon" />    <script type="text/javascript" src="./Public_JS/jquery.min.js"></script>    <script type="text/javascript" src="./Public_JS/jquery.cookie.js"></script>    <script type="text/javascript" src="./bootstrap/js/bootstrap.min.js"></script>    <script type="text/javascript" src="./Public_JS/redirect.js"></script>    <script type="text/javascript" src="./Public_JS/page_title.js"></script>    <script>        (function() {            const designWidth = 750;            const docEl = document.documentElement;            const resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';            const recalc = function() {                const clientWidth = docEl.clientWidth;                if (!clientWidth) return;                docEl.style.fontSize = 100 * (clientWidth / designWidth) + 'px';            };            if (!document.addEventListener) return;            window.addEventListener(resizeEvt, recalc, false);            document.addEventListener('DOMContentLoaded', recalc, false);        })();    </script>    <style>        * {            margin: 0;            padding: 0;        }        .health-wrapper {            width: 100%;        }        .health-wrapper .health-bg {            margin: 0 auto;        }        @media (max-width: 767px) {            .health-wrapper {                padding: 2rem .5rem;                box-sizing: border-box;            }            .health-wrapper .health-bg {                width: 5.2rem;                height: 5.2rem;            }            .health-wrapper .health-content p:nth-child(1) {                font-size: .32rem;                color: #333;            }        }        @media (min-width: 768px) {            .health-wrapper {                padding: 100px 30px;                box-sizing: border-box;            }            .health-wrapper .health-bg {                width: 460px;                height: 460px;            }            .health-wrapper .health-content p:nth-child(1) {                font-size: 16px;                color: #333;            }            .health-wrapper .health-content p:nth-child(2) {                font-size: 14px;                color: #666;            }        }    </style></head><body>    <div class="health-wrapper">        <div class="health-bg">            <img src="" alt="" style="width: 100%; height: 100%;">        </div>        <div class="health-content text-center"></div>    </div></body><script>$(document).ready(function() {    if (browserRedirect()) {        $(".health-bg img").attr("src", './P_IMG/health-h5.png');        $(".health-content").html(`<p>为守护您的网络安全，京东云无线宝已拦截存在有害内容的网站</p>`);    } else {        $(".health-bg img").attr("src", './P_IMG/health-pc.png');        $(".health-content").html(`<p>当前访问的网站存在有害内容，为避免给您造成损失，路由器正在守护您的上网安全</p><p>如影响到您的正常访问，请使用绑定该设备的无线宝APP关闭有害网站过滤功能</p>`);    }})</script></html>
