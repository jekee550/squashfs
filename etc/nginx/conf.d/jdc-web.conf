server {
	listen       80;
	listen       [::]:80 ipv6only=on;
	server_name  localhost;

	#charset koi8-r;

	#access_log  logs/host.access.log  main;

	#location ~* \.(jpg|jpeg|png)$ {
	#	root   /www;
        #	expires 365d;
   	#}
	
	location / {
		root   /www;
		add_header Cache-Control "no-cache, no-store";
		index  index.html index.htm;
	}

	location /jdcapi {
		ubus_interpreter;
		ubus_socket_path /var/run/ubus.sock;
		ubus_parallel_req 2;
		ubus_cors off;
	}
	
	location /api/joylink {
        default_type application/json;
        content_by_lua '
            	local json = require "cjson.safe"
		local joylink_local = require "jdc_joylink_local"
            	ngx.req.read_body()
            	local request_body = ngx.req.get_body_data()
            	out = joylink_local.call(request_body)
            	ngx.say(json.encode(out))
        	';
   	 }
	
	location /api/api_wrapper {
        default_type application/json;
        content_by_lua '
            	local json = require "cjson.safe"
		local cookie = ngx.var.http_cookie
		if not cookie then
			ngx.status = ngx.HTTP_FORBIDDEN
			ngx.exit(200)
		end
		token=string.sub(cookie,-32)
		if token == nil or token == "" then
			ngx.status = ngx.HTTP_FORBIDDEN
			ngx.exit(200)
		end
		local token_len = string.len(token)
		if(token_len ~= 32 or token:match("%W")) then
			ngx.status = ngx.HTTP_FORBIDDEN
			ngx.exit(200)
		end
		local file = io.open("/opt/etc/config/" .. token, "r")
		if file == nil then
			ngx.status = ngx.HTTP_FORBIDDEN
			ngx.exit(200)
		end
		io.close(file)
		local api_wrapper = require "jdc_api_wrapper"
            	ngx.req.read_body()
            	local request_body = ngx.req.get_body_data()
            	out = api_wrapper.call(request_body)
            	ngx.say(json.encode(out))
        	';
   	 }

        location /video {
                content_by_lua_file '/usr/lib/lua/jdc_cast_screen.lua';
        }

        location /videoi/mnt {
                internal;
                alias /mnt;
        }

	location ~* /cgi-bin/luci-.* {
		# for luci-upload luci-backup
                # Disable gzip (it makes scripts feel slower since they have to complete
                # before getting gzipped)
                gzip off;
                # Set the root to /usr/lib (inside this location this means that we are
                # giving access to the files under /usr/lib/cgi-bin)
                root /www;
                # Fastcgi socket
                fastcgi_pass unix:/var/run/fcgiwrap.socket;
                # Fastcgi parameters, include the standard ones
                include /etc/nginx/fastcgi_params;
                # Adjust non standard parameters (SCRIPT_FILENAME)
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

	location ~* /cgi-bin/luci.* {
		root /www;
		fastcgi_pass unix:/var/run/fcgiwrap.socket;
		fastcgi_index /cgi-bin/luci;
		fastcgi_split_path_info  (/cgi-bin/luci)(.*)$;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
		include fastcgi_params;
	}

	location /cgi-bin {
                # Disable gzip (it makes scripts feel slower since they have to complete
                # before getting gzipped)
                gzip off;
                # Set the root to /usr/lib (inside this location this means that we are
                # giving access to the files under /usr/lib/cgi-bin)
                root /www;
                # Fastcgi socket
                fastcgi_pass unix:/var/run/fcgiwrap.socket;
                # Fastcgi parameters, include the standard ones
                include /etc/nginx/fastcgi_params;
                # Adjust non standard parameters (SCRIPT_FILENAME)
                fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

	## tencent-booster plugin
	location /get_download_info {
		proxy_pass http://127.0.0.1:50602;
	}
	## tencent-booster plugin

	#error_page  404              /404.html;
	error_page 404 $scheme://$server_addr;

	# redirect server error pages to the static page /50x.html
	#
	error_page   500 502 503 504  /50x.html;
	location = /50x.html {
		root   html;
	}

	# proxy the PHP scripts to Apache listening on 127.0.0.1:80
	#
	#location ~ \.php$ {
	#    proxy_pass   http://127.0.0.1;
	#}

	# pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
	#
	#location ~ \.php$ {
	#    root           html;
	#    fastcgi_pass   127.0.0.1:9000;
	#    fastcgi_index  index.php;
	#    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
	#    include        fastcgi_params;
	#}

	# deny access to .htaccess files, if Apache's document root
	# concurs with nginx's one
	#
	#location ~ /\.ht {
	#    deny  all;
	#}
}
